name: "Publish"

on:
  workflow_run:
    workflows: ["Test"]
    types: ["completed"]
    branches: ["main"]

jobs:
  publish-npm:
    if: "github.event.workflow_run.conclusion == 'success'"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v6"
        with:
          ref: "${{ github.event.workflow_run.head_sha }}"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: "Install dependencies"
        run: "npm ci"

      - name: "Check if version is new"
        id: "check"
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @earlytexts/markit version 2>/dev/null || echo "0.0.0")
          echo "Current: $CURRENT, Published: $PUBLISHED"
          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: "Build"
        if: "steps.check.outputs.publish == 'true'"
        run: "npm run build"

      - name: "Publish to npm"
        if: "steps.check.outputs.publish == 'true'"
        run: "npm publish --access public --ignore-scripts"
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"

  publish-vscode:
    if: "github.event.workflow_run.conclusion == 'success'"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v6"
        with:
          ref: "${{ github.event.workflow_run.head_sha }}"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version: "24"
          cache: "npm"

      - name: "Install dependencies"
        run: "npm ci"

      - name: "Install VS Code extension dependencies"
        run: "cd vscode-markit && npm ci"

      - name: "Check if version is new"
        id: "check"
        run: |
          CURRENT=$(node -p "require('./vscode-markit/package.json').version")
          PUBLISHED=$(curl -s -X POST \
            "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"earlytexts.markit-language"}]}],"flags":512}' \
            | jq -r '.results[0].extensions[0].versions[0].version // "0.0.0"')
          echo "Current: $CURRENT, Published: $PUBLISHED"
          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: "Publish to VS Code Marketplace"
        if: "steps.check.outputs.publish == 'true'"
        run: "cd vscode-markit && npx vsce publish --no-dependencies"
        env:
          VSCE_PAT: "${{ secrets.VSCE_PAT }}"
